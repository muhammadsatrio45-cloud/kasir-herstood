<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herstoodio</title>
<link rel="icon" href="/img/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="theme-color" content="#ee3a82">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Herstoodio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:"Fredoka";src:url(/fonts/fredoka.woff2) format("woff2");font-weight:300 700;font-display:swap}
:root{
  --primary:#ee3a82; --accent:#be123c; --sidebar:#e0246f; --bg:#fff0f6; --card:#fffaf6; --text:#231f1e; --radius:18px;
  --font:"Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --ink:var(--text);
  --border:color-mix(in srgb,var(--text) 18%,var(--card));
  --muted:color-mix(in srgb,var(--text) 58%,var(--card));
  --primary-soft:color-mix(in srgb,var(--primary) 14%,var(--card));
  --primary-dark:color-mix(in srgb,var(--primary) 72%,#000);
  --ok:#15803d; --ok-soft:color-mix(in srgb,#22c55e 16%,var(--card));
  --warn:#b45309; --warn-soft:color-mix(in srgb,#f59e0b 18%,var(--card));
  --danger:#dc2626;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--text);font-size:14px;background-color:var(--bg);
  background-image:linear-gradient(90deg,color-mix(in srgb,var(--primary) 8%,transparent) 50%,transparent 50%),linear-gradient(color-mix(in srgb,var(--primary) 8%,transparent) 50%,transparent 50%);
  background-size:38px 38px}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
body.no-mascot .mascot-wrap{display:none!important}
/* layout */
#app{display:flex;height:100vh}
aside{width:236px;color:#fff;display:flex;flex-direction:column;padding:16px 12px;flex-shrink:0;border-right:2px solid var(--ink);
  background-color:var(--sidebar);
  background-image:linear-gradient(90deg,rgba(255,255,255,.09) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.09) 50%,transparent 50%);background-size:38px 38px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 16px}
.brand img{width:46px;height:46px;border-radius:14px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);flex-shrink:0;background:var(--primary)}
.brand .bn{font-weight:700;font-size:18px;line-height:1.05;color:#fff;text-shadow:1.5px 1.5px 0 var(--ink)}
.brand .bn{min-width:0}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.95;text-shadow:none;margin-top:2px;white-space:normal;line-height:1.2}
nav{display:flex;flex-direction:column;gap:5px}
nav button{display:flex;align-items:center;gap:12px;background:none;border:2px solid transparent;color:#fff;padding:9px 12px;border-radius:14px;cursor:pointer;text-align:left;font-size:14px;font-weight:500}
nav button:hover{background:rgba(255,255,255,.16)}
nav button.active{background:var(--card);color:var(--ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:600}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.mascot-side{display:flex;align-items:flex-end;gap:8px;cursor:pointer}
.mascot-side img{width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);background:var(--primary);flex-shrink:0;animation:bob 3s ease-in-out infinite}
.bubble{position:relative;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:7px 10px;font-size:12px;line-height:1.3;flex:1}
.bubble:before{content:"";position:absolute;left:-8px;bottom:12px;width:12px;height:12px;background:var(--card);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.sum-box{background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:3px 3px 0 var(--ink)}
.sum-box small{color:var(--muted);font-size:11px}
.sum-box b{display:block;font-size:15px;margin-top:2px}
.sum-box em{font-style:normal;color:var(--primary-dark);font-weight:700;font-size:15px}
.user-box{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;padding:0 2px}
.user-box button{background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer;font-weight:600}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 24px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:26px;margin-right:auto;font-weight:700;letter-spacing:.2px}
.topbar h1:after{content:" ✦";color:var(--primary);font-size:18px}
.content{flex:1;overflow:auto;padding:0 24px 28px}
.menu-toggle{display:none}
/* controls */
.btn{background:var(--primary);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:600;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.sec{background:var(--card);color:var(--ink);text-shadow:none}
.btn.ok{background:#22c55e;color:#06290f;text-shadow:none}
.btn.danger{background:var(--danger)}
.btn.sm{padding:3px 12px;font-size:12px;box-shadow:0 2px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input,select.input,textarea.input{background:var(--card);border:2px solid color-mix(in srgb,var(--ink) 35%,var(--card));border-radius:14px;padding:8px 12px;width:100%;outline:none}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--primary-soft),2px 2px 0 var(--primary)}
.searchbox{position:relative;width:260px;max-width:100%}
.searchbox input{padding-left:34px}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.card{background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);padding:16px;box-shadow:3px 3px 0 var(--ink)}
.grid{display:grid;gap:14px}
.cards4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat small{color:var(--muted)}
.stat b{display:block;font-size:22px;margin-top:4px}
.stat.pk{background:var(--primary-soft)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;border-bottom:1.5px dashed var(--border);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right}
.table-wrap{background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);overflow:auto;box-shadow:3px 3px 0 var(--ink)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1.5px solid var(--ink);white-space:nowrap}
.badge.paid{background:var(--ok-soft);color:var(--ok)}
.badge.unpaid{background:var(--warn-soft);color:var(--warn)}
.badge.off{background:var(--border);color:var(--muted)}
.badge.dp{background:var(--primary-soft);color:var(--primary-dark)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.sm{font-size:12px}
h2{font-size:17px;margin:0 0 12px;font-weight:700}
h2:before{content:"♡ ";color:var(--primary)}
.hint{font-size:12px;color:var(--muted);margin-top:4px;min-height:16px}
.hero{display:flex;align-items:center;gap:18px;margin-bottom:14px;background:var(--primary-soft)}
.hero img{width:112px;height:112px;border-radius:22px;border:2px solid var(--ink);object-fit:cover;flex-shrink:0;animation:bob 3.4s ease-in-out infinite}
.hero h2{font-size:22px;margin-bottom:4px}.hero h2:before{content:""}
.hero p{margin:0 0 10px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty img{width:120px;height:120px;border-radius:50%;border:2px solid var(--ink);margin-bottom:8px}
/* kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;align-items:start;overflow-x:auto;padding:2px 2px 10px}
.col{background:color-mix(in srgb,var(--primary) 7%,var(--card));border:2px solid var(--ink);border-radius:var(--radius);padding:12px;min-height:240px}
.col.over{outline:3px dashed var(--primary)}
.col-h{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:12px}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink)}
.cnt{background:var(--card);border:1.5px solid var(--ink);border-radius:999px;font-size:11px;padding:0 8px;font-weight:700}
.ocard{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px;margin-bottom:11px;cursor:pointer;position:relative;box-shadow:2px 2px 0 var(--ink)}
.ocard:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.ocard .no{color:var(--primary-dark);font-weight:700;font-size:13px}
.ocard .meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-top:4px}
.ocard .meta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.ocard .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard .price{position:absolute;right:12px;top:12px;font-weight:700}
.ocard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.prog{height:7px;border-radius:7px;background:var(--border);overflow:hidden;margin-top:10px;border:1.5px solid var(--ink)}
.prog i{display:block;height:100%}
.adv{background:var(--card);border:1.5px solid var(--ink);border-radius:999px;font-size:11px;padding:1px 10px;cursor:pointer;font-weight:600}
.adv:hover{background:var(--primary);color:#fff}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(35,15,28,.55);display:grid;place-items:center;z-index:50;padding:14px}
.modal{background:var(--card);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:22px;width:100%;max-width:520px;max-height:93vh;overflow:auto;padding:20px}
.modal.wide{max-width:1080px}
.modal.mid{max-width:700px}
.modal h3{margin:0 0 14px;font-size:20px}
.mini-av{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.four{display:grid;grid-template-columns:1.2fr 1fr .7fr 1fr;gap:10px}
/* pos */
.pos{display:grid;grid-template-columns:1fr 390px;gap:18px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:34vh;overflow:auto;padding:4px 2px;margin-top:10px}
.pitem{border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:10px;cursor:pointer;text-align:left;box-shadow:2px 2px 0 var(--ink)}
.pitem:hover{background:var(--primary-soft)}
.pitem b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem span{color:var(--primary-dark);font-weight:700;font-size:13px}
.pitem .pn{display:block;font-style:normal;font-weight:500;font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-name{font-weight:500}
.pitem small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.cart{border:2px solid var(--ink);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;max-height:78vh;overflow:auto;background:color-mix(in srgb,var(--primary) 6%,var(--card))}
.cline{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:9px 10px}
.cart #pSave{position:sticky;bottom:-4px;z-index:2}
.cl-top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.cl-top .x{background:none;border:1.5px solid var(--ink);border-radius:50%;width:22px;height:22px;line-height:1;cursor:pointer;font-weight:700}
.cl-grid{display:grid;grid-template-columns:1.3fr 1fr .7fr;gap:6px;margin-top:6px}
.cl-grid label{font-size:10px;color:var(--muted);font-weight:600}
.cl-grid input{width:100%;border:1.5px solid color-mix(in srgb,var(--ink) 35%,var(--card));border-radius:10px;padding:4px 7px;background:var(--card);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--ink);background:var(--card);border-radius:999px;padding:4px 13px;cursor:pointer;font-size:12px;font-weight:600}
.chip.on{background:var(--primary);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.trow{display:flex;justify-content:space-between;gap:10px}
.trow.big{font-size:18px;font-weight:700}
.dpbox{background:var(--primary-soft);border:2px dashed var(--ink);border-radius:12px;padding:8px 10px;margin-top:6px}
/* chart */
.bars{display:flex;align-items:flex-end;gap:7px;height:160px;padding-top:10px}
.bar{flex:1;min-width:14px;max-width:64px;background:var(--primary);border:2px solid var(--ink);border-radius:8px 8px 0 0;min-height:3px}
.bar:hover{background:var(--accent)}
.barlbl{display:flex;gap:7px}
.barlbl span{flex:1;max-width:64px;text-align:center;font-size:10px;color:var(--muted);overflow:hidden}
/* invoice */
.invoice{--text:#231f1e;--card:#fffdf9;--muted:#7a6a68;--border:#ecd9d3;--ink:#231f1e;background:var(--card);color:var(--text);border:2px solid var(--ink);border-radius:18px;font-size:13px;overflow:hidden;font-family:var(--font)}
.inv-head{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:2px solid var(--ink);background-color:var(--primary);background-image:linear-gradient(90deg,rgba(255,255,255,.14) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.14) 50%,transparent 50%);background-size:30px 30px}
.inv-logo{width:62px;height:62px;border-radius:16px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);flex-shrink:0}
.inv-brand{flex:1;min-width:0}
.brackets{font-weight:700;font-size:24px;color:#231f1e;line-height:1.1}
.inv-brand .tg,.inv-brand .ad{display:table;max-width:100%;margin-top:5px;padding:2px 11px;background:#fffaf0;color:#231f1e;border:1.5px solid #231f1e;border-radius:999px;font-weight:600;line-height:1.35;box-shadow:2px 2px 0 #231f1e}
.inv-brand .tg{font-size:12.5px}
.inv-brand .ad{font-size:12px}
.inv-brand .tg:empty,.inv-brand .ad:empty{display:none}
.inv-char{width:84px;height:84px;border-radius:50%;border:3px solid var(--ink);flex-shrink:0;background:var(--primary);margin:-4px 0 -22px;position:relative;box-shadow:3px 3px 0 var(--ink)}
.inv-ribbon{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:6px 18px;font-weight:700;letter-spacing:.08em}
.inv-ribbon b{color:#ffb3d1}
.inv-body{padding:14px 18px 8px}
.inv-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-bottom:10px;font-size:12px}
.inv-meta span{color:var(--muted)}
.invoice table th{color:var(--muted);border-bottom:2px solid var(--ink);padding:5px 6px}
.invoice td{border-bottom:1.5px dashed var(--border);padding:5px 6px}
.invoice .tot{margin-left:auto;width:290px;max-width:100%;margin-top:10px}
.invoice .tot .trow{padding:2px 0}
.invoice .tot .grand{font-weight:700;font-size:16px;border-top:2px solid var(--ink);margin-top:4px;padding-top:5px}
.invoice .tot .dp{background:color-mix(in srgb,var(--primary) 16%,#fff);border:2px dashed var(--ink);border-radius:10px;padding:4px 8px;margin-top:6px;font-weight:700}
.invoice .tot .sisa{font-weight:800;font-size:15px;color:var(--accent);border-top:2px solid var(--ink);margin-top:5px;padding-top:5px}
.inv-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 18px 14px;position:relative}
.stamp{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;border:3px double;text-align:center;font-weight:800;font-size:13px;line-height:1.15;transform:rotate(-11deg);flex-shrink:0;padding:6px;background:rgba(255,255,255,.75)}
.stamp.paid{color:#15803d}.stamp.dp{color:var(--primary-dark)}.stamp.unpaid{color:#dc2626}
.inv-thanks{text-align:right;font-weight:600;font-size:13px}
.inv-thanks small{display:block;font-weight:400;color:var(--muted);margin-top:3px}
.inv-edge{height:14px;background-color:var(--primary);background-image:radial-gradient(circle at 8px 0,var(--card) 7.5px,transparent 8px);background-size:16px 14px;background-repeat:repeat-x;border-top:2px solid var(--ink)}
.invoice.struk{width:300px;font-size:12px;border-radius:0;border:0}
.struk .c{text-align:center}
.struk .dash{border-top:2px dashed #231f1e;margin:6px 0}
.struk .brackets{font-size:18px}
.struk img.sl{width:48px;height:48px;border-radius:12px;border:2px solid #231f1e}
.struk img.sc{width:64px;height:64px;border-radius:50%;border:2px solid #231f1e}
.struk .it{margin-bottom:4px}
.struk .tot{width:100%;margin-top:4px}
.struk .stamp{width:auto;height:auto;border-radius:6px;transform:none;padding:2px 8px;display:inline-block}
#print-area{display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 20px;border-radius:999px;z-index:99;font-size:13px;border:2px solid #fff;box-shadow:3px 3px 0 var(--primary)}
.toast.err{background:var(--danger)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background-color:var(--primary);background-image:linear-gradient(90deg,rgba(255,255,255,.1) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.1) 50%,transparent 50%);background-size:42px 42px}
.login-card{display:grid;grid-template-columns:minmax(220px,300px) 330px;background:var(--card);border:2px solid var(--ink);border-radius:26px;box-shadow:8px 8px 0 var(--ink);overflow:hidden;max-width:100%}
.login-card .art{background:var(--primary);display:grid;place-items:center;padding:14px;border-right:2px solid var(--ink)}
.login-card .art img{width:100%;border-radius:18px;border:2px solid var(--ink);display:block}
.login-card form{padding:26px;display:flex;flex-direction:column;justify-content:center}
.login-card .lg{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.login-card .lg img{width:48px;height:48px;border-radius:14px;border:2px solid var(--ink)}
.login-card h1{margin:0;font-size:26px;line-height:1}
.swatch{display:flex;gap:8px;flex-wrap:wrap}
.swatch button{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:3px 12px 3px 4px;cursor:pointer;font-weight:600;font-size:12px}
.swatch i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:block}
input[type=color]{width:100%;height:38px;padding:2px;border:2px solid var(--ink);border-radius:12px;background:var(--card);cursor:pointer}
@media(max-width:900px){
  aside{position:fixed;left:-260px;top:0;bottom:0;z-index:40;transition:left .2s}
  aside.open{left:0}
  .menu-toggle{display:inline-block}
  .pos{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(4,265px)}
  .two,.three,.four{grid-template-columns:1fr 1fr}
  .topbar,.content{padding-left:14px;padding-right:14px}
  .login-card{grid-template-columns:1fr}
  .login-card .art{display:none}
  .hero img{width:76px;height:76px}
}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body *{visibility:hidden}
  body{background:#fff}
  #print-area,#print-area *{visibility:visible}
  #print-area{display:block;position:absolute;left:0;top:0;width:100%}
  .invoice{box-shadow:none}
}
/* ===== tema alat tulis: buku catatan, washi tape, stiker die-cut ===== */
body{background-image:radial-gradient(color-mix(in srgb,var(--primary) 32%,transparent) 1.4px,transparent 1.7px);background-size:22px 22px}
.hero,.invoice,.login-card{position:relative}
.hero::before,.invoice::before{content:"";position:absolute;top:-8px;left:26px;width:92px;height:22px;z-index:3;transform:rotate(-3deg);opacity:.9;
  background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--primary) 55%,#fff) 0 8px,color-mix(in srgb,var(--primary) 30%,#fff) 8px 16px);box-shadow:0 1px 0 rgba(0,0,0,.12)}

  background:repeating-linear-gradient(45deg,rgba(255,255,255,.8) 0 8px,rgba(255,255,255,.5) 8px 16px);box-shadow:none}

.struk .inv-body::before{display:none}
.cb{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 2px;border-radius:999px;font-size:10.5px;font-weight:600;border:1.5px solid var(--ink,#231f1e);background:#fff;color:#231f1e;white-space:nowrap;vertical-align:middle;line-height:1.5}
.cb i{font-style:normal;font-size:9px;font-weight:700;border-radius:999px;padding:0 5px;background:#e5e7eb;color:#231f1e}
.cb[data-c=china] i{background:#fecaca}.cb[data-c=korea] i{background:#bfdbfe}.cb[data-c=thailand] i{background:#ddd6fe}.cb[data-c=jepang] i{background:#fbcfe8}
.cbs{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.pitem .cb{display:flex;width:max-content;margin-top:4px}
.payopts{margin-top:14px;padding:10px 4px 4px}
.po-title{text-align:center;font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.po-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.po{text-align:center;padding:10px 8px;background:#fff;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 2px #231f1e,3px 4px 0 2px #231f1e}
.po small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.po b{display:block;font-size:20px;line-height:1.25;color:#231f1e}
.po span{font-size:11px;color:var(--muted)}
.po1{transform:rotate(-1.2deg);background:color-mix(in srgb,var(--primary) 16%,#fff)}
.po2{transform:rotate(1deg);background:#fff7d6}
.struk .po-grid{grid-template-columns:1fr}.struk .po{box-shadow:0 0 0 1.5px #231f1e;transform:none}.struk .po b{font-size:15px}
.invoice .tot .subdp{font-weight:700;color:var(--primary-dark);padding:2px 0}
.cc{display:inline-block;min-width:22px;padding:0 4px;margin-right:4px;border:1.5px solid #231f1e;border-radius:6px;font-size:10.5px;text-align:center;background:color-mix(in srgb,var(--primary) 18%,#fff)}
.pc{font-weight:700;letter-spacing:.02em;margin-right:2px}
.settle .tot{margin-left:auto}
.settle .payopts{margin-top:14px;padding:6px 0 4px}

.settle .po{display:flex;flex-direction:column;justify-content:center;transform:none!important;padding:10px 8px}
.inv-foot{border-top:2px dashed color-mix(in srgb,var(--ink) 38%,transparent);margin:16px 12px 0;padding:14px 8px 8px}
.inv-foot::before{content:"\2702";position:absolute;left:10px;top:-13px;background:var(--card);padding:0 4px;font-size:15px;line-height:1;color:var(--ink)}
.inv-code{display:flex;align-items:center;justify-content:center;gap:12px;padding:2px 18px 14px;font-size:11px;letter-spacing:.2em;color:var(--muted)}

.struk .inv-code,.struk .inv-foot::before{display:none}
@media(max-width:560px){.invoice:not(.wide) .settle .po-grid{grid-template-columns:1fr 1fr;gap:10px}.invoice:not(.wide) .settle .po b{font-size:15px}.invoice:not(.wide) .inv-code .ibar{width:70px}}
@media print{.invoice tr,.settle,.payopts,.po,.inv-foot,.inv-code{break-inside:avoid;page-break-inside:avoid}.invoice th{break-after:avoid}}
.stamp.wait{color:var(--primary-dark);font-size:12px}
@media(max-width:560px){
  .invoice:not(.wide)::before{left:auto;right:18px;width:84px;height:22px;transform:rotate(-1deg)}
  .invoice:not(.wide) .inv-head{padding:10px 12px;gap:8px}.invoice:not(.wide) .inv-logo{width:46px;height:46px}.invoice:not(.wide) .inv-char{width:58px;height:58px;margin:0}
  .invoice:not(.wide) .brackets{font-size:17px;white-space:nowrap}.invoice:not(.wide) .inv-brand .tg,.invoice:not(.wide) .inv-brand .ad{font-size:10px;padding:1px 8px;box-shadow:1px 1px 0 #231f1e}
  .invoice:not(.wide) .inv-body{padding:12px 10px 6px 30px}.invoice:not(.wide) .inv-body::before{left:6px;width:14px;background-size:14px 28px}
  .invoice:not(.wide) .inv-meta{grid-template-columns:1fr}.invoice:not(.wide) .dpc{display:none}
  .invoice:not(.wide) table{font-size:11px}.invoice:not(.wide) th,.invoice:not(.wide) td{padding:4px 2px}.invoice:not(.wide) td.num,.invoice:not(.wide) th.num{white-space:nowrap}
  .invoice:not(.wide) .inv-foot{flex-direction:column;align-items:center;text-align:center}.invoice:not(.wide) .inv-thanks{text-align:center}
}
</style>

<body>
<div id="login" class="hidden">
  <div class="login-card">
    <div class="art"><img src="/img/herstood.jpg" alt="herstood"></div>
    <form id="loginForm">
      <div class="lg"><img src="/img/logo-h.jpg" alt=""><h1 id="loginTitle">Herstoodio</h1></div>
      <p class="muted" id="loginTag" style="margin:0 0 18px">Masuk dulu ya, kak ♡</p>
      <div class="field"><label>Username</label><input class="input" name="username" autocomplete="username" autofocus required></div>
      <div class="field"><label>Password</label><input class="input" type="password" name="password" autocomplete="current-password" required></div>
      <div id="loginErr" style="color:var(--danger);min-height:18px;margin-bottom:8px;font-size:13px"></div>
      <button class="btn">Masuk ✦</button>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><img src="/img/logo-h.jpg" alt=""><div class="bn"><span id="brandName">Herstoodio</span><small id="brandTag"></small></div></div>
    <nav id="nav"></nav>
    <div class="side-bottom">
      <div class="mascot-side mascot-wrap" id="mascotSide"><img src="/img/herstood-face.jpg" alt=""><div class="bubble" id="bubble">Halo kak! ♡</div></div>
      <div class="sum-box"><small>Ringkasan hari ini</small><b id="sumOrders">0 Order</b><em id="sumRev">Rp 0</em></div>
      <div class="user-box"><span id="userInfo"></span><button id="btnLogout">Keluar</button></div>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <button class="btn sec menu-toggle" id="menuToggle">☰</button>
      <h1 id="pageTitle"></h1>
      <div id="topActions" class="row"></div>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="print-area"></div>

<script>
"use strict";
/* ============ util ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const S = { token: localStorage.getItem("kasir_token") || "", user: null, settings: {}, products: [], customers: [], view: "order", timer: null, orderFilter: { date: "today", q: "" }, pending: 0 };
const fmt = n => `${S.settings.currency || "Rp"} ${Math.round(+n || 0).toLocaleString("id-ID")}`;
const todayStr = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const isAdmin = () => S.user && S.user.role === "admin";
const mascotOn = () => +S.settings.mascot_on !== 0;
const ICON = {
  dashboard: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/>',
  order: '<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  produk: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>',
  pelanggan: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  keuangan: '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  laporan: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  pengaturan: '<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
  search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  bag: '<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>',
};
const svg = n => `<svg viewBox="0 0 24 24">${ICON[n] || ""}</svg>`;

async function api(method, url, body, raw) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json", Authorization: "Bearer " + S.token }, body: body ? JSON.stringify(body) : undefined });
  if (raw && r.ok) return r;
  let data = {};
  try { data = await r.json(); } catch (e) { }
  if (r.status === 401 && S.token) { logoutLocal(); throw new Error(data.error || "Sesi habis"); }
  if (!r.ok) throw new Error(data.error || "Terjadi kesalahan");
  return data;
}
function toast(msg, err) {
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = (err ? "" : "✦ ") + msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
const guard = fn => async (...a) => { try { return await fn(...a); } catch (e) { toast(e.message, true); } };
function copyText(txt) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt);
  const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); return Promise.resolve();
}

/* ============ modal ============ */
let modalEl = null;
function openModal(html, cls = "") {
  closeModal();
  modalEl = document.createElement("div"); modalEl.className = "overlay";
  modalEl.innerHTML = `<div class="modal ${cls}">${html}</div>`;
  modalEl.addEventListener("mousedown", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  return modalEl.firstElementChild;
}
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }
document.addEventListener("keydown", e => { if (e.key === "Escape" && !(S.user && S.user.must_change)) closeModal(); });

/* ============ theme ============ */
const FONTS = {
  Cute: '"Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif',
  Inter: 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif',
  Serif: 'Georgia,"Times New Roman",serif',
  Mono: 'ui-monospace,"SF Mono",Consolas,monospace',
};
const FONT_LABEL = { Cute: "Imut (Fredoka)", Inter: "Polos", Serif: "Klasik", Mono: "Mono" };
const P = (primary, accent, sidebar, bg, card, text) => ({ color_primary: primary, color_accent: accent, color_sidebar: sidebar, color_bg: bg, color_card: card, color_text: text });
const PRESETS = {
  "Herstoodio": P("#ee3a82", "#be123c", "#e0246f", "#fff0f6", "#fffaf6", "#231f1e"),
  "Rose": P("#e11d48", "#9f1239", "#be123c", "#fff1f2", "#fffafa", "#3b0a14"),
  "Bubblegum": P("#ff7eb6", "#c026d3", "#f0599b", "#fff0f8", "#ffffff", "#3b1030"),
  "Peach": P("#fb7c5c", "#e11d48", "#e8643f", "#fff4ee", "#fffaf7", "#3a1d12"),
  "Lavender": P("#a78bfa", "#ec4899", "#7c3aed", "#f5f1ff", "#fffcff", "#2b1d54"),
  "Mint": P("#2dd4a0", "#f472b6", "#0f9d78", "#effcf6", "#fbfffd", "#12392c"),
  "Langit": P("#38bdf8", "#f472b6", "#0284c7", "#eef8ff", "#fcfeff", "#0c3552"),
};
function applyTheme(s = S.settings) {
  const r = document.documentElement.style;
  r.setProperty("--primary", s.color_primary); r.setProperty("--accent", s.color_accent);
  r.setProperty("--sidebar", s.color_sidebar); r.setProperty("--radius", (s.radius ?? 18) + "px");
  r.setProperty("--font", FONTS[s.font] || FONTS.Cute);
  if (+s.dark_mode) { r.setProperty("--bg", "#1b0e16"); r.setProperty("--card", "#2a1722"); r.setProperty("--text", "#ffe8f1"); }
  else { r.setProperty("--bg", s.color_bg); r.setProperty("--card", s.color_card || "#fffaf6"); r.setProperty("--text", s.color_text || "#231f1e"); }
  document.body.classList.toggle("no-mascot", +s.mascot_on === 0);
  document.title = (s.store_name || "Herstoodio") + " - Kasir";
  $("#brandName").textContent = s.store_name || "Herstoodio";
  $("#brandTag").textContent = s.tagline || "";
  $("#loginTitle").textContent = s.store_name || "Herstoodio";
}

/* ============ maskot ============ */
const SAYS = ["Semangat jastipnya, kak! ♡", "Jangan lupa catat DP ya ✦", "Cek yang belum lunas yuk~", "Hari ini cuan berapa? ✿", "Aku jagain kasirnya! ♡", "Ada order baru? Ayo catat!", "Pelanggan senang, kita senang ✦", "Istirahat dulu, minum air ya ♡"];
function say(msg) { const b = $("#bubble"); if (b) b.textContent = msg || SAYS[Math.floor(Math.random() * SAYS.length)]; }
$("#mascotSide").onclick = () => say(S.pending ? `Masih ada ${S.pending} order berjalan lho, kak ✦` : null);

/* ============ auth ============ */
function logoutLocal() { S.token = ""; localStorage.removeItem("kasir_token"); clearInterval(S.timer); closeModal(); $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault(); const f = new FormData(e.target); $("#loginErr").textContent = "";
  try {
    const r = await api("POST", "/api/login", { username: f.get("username"), password: f.get("password") });
    S.token = r.token; localStorage.setItem("kasir_token", r.token); e.target.reset(); await start();
  } catch (er) { $("#loginErr").textContent = er.message; }
});
$("#btnLogout").onclick = async () => { try { await api("POST", "/api/logout"); } catch (e) { } logoutLocal(); };
$("#menuToggle").onclick = () => $("#side").classList.toggle("open");

async function start() {
  try {
    const b = await api("GET", "/api/bootstrap");
    Object.assign(S, { user: b.user, settings: b.settings, products: b.products, customers: b.customers });
  } catch (e) { return showLogin(); }
  applyTheme();
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#userInfo").textContent = `${S.user.name} (${S.user.role})`;
  const items = [["dashboard", "Dashboard"], ["order", "Order"], ["produk", "Master Produk"], ["pelanggan", "Pelanggan"], ["keuangan", "Keuangan"], ["laporan", "Laporan"], ["pengaturan", "Pengaturan"]];
  $("#nav").innerHTML = items.map(([k, l]) => `<button data-v="${k}">${svg(k)}<span>${l}</span></button>`).join("");
  $$("#nav button").forEach(b => b.onclick = () => { go(b.dataset.v); $("#side").classList.remove("open"); });
  go(S.view || "order"); say("Halo " + S.user.name + "! ♡");
  clearInterval(S.timer);
  S.timer = setInterval(() => { if (document.hidden || modalEl) return; if (S.view === "order") loadOrders(true); refreshSummary(); }, 30000);
  if (S.user.must_change) forcePassword();
}
function forcePassword() {
  const m = openModal(`<h3>Ganti password dulu ya ♡</h3><p class="muted">Password dari admin hanya sementara. Buat password barumu sendiri (min. 6 karakter).</p>
    <div class="field"><input class="input" type="password" id="fpOld" placeholder="Password sementara"></div>
    <div class="field"><input class="input" type="password" id="fpNew" placeholder="Password baru"></div>
    <button class="btn" id="fpSave">Simpan Password</button>`);
  modalEl.onmousedown = null;
  m.querySelector("#fpSave").onclick = guard(async () => {
    await api("POST", "/api/change-password", { old: $("#fpOld", m).value, new: $("#fpNew", m).value });
    S.user.must_change = 0; closeModal(); toast("Password berhasil diganti");
  });
}
async function showLogin() {
  try { const s = await fetch("/api/public-settings").then(r => r.json()); S.settings = s; applyTheme(s); $("#loginTag").textContent = s.tagline ? s.tagline + " ♡" : "Masuk dulu ya, kak ♡"; } catch (e) { }
  $("#app").classList.add("hidden"); $("#login").classList.remove("hidden");
}
async function refreshProducts() {
  const b = await api("GET", "/api/bootstrap"); S.products = b.products; S.customers = b.customers;
}
async function refreshSummary() {
  try {
    const d = await api("GET", "/api/dashboard");
    S.pending = d.pending;
    $("#sumOrders").textContent = `${d.today.orders} Order`; $("#sumRev").textContent = fmt(d.today.revenue);
  } catch (e) { }
}

/* ============ router ============ */
const VIEWS = { dashboard: vDashboard, order: vOrder, produk: vMaster, pelanggan: vCustomers, keuangan: vFinance, laporan: vReport, pengaturan: vSettings };
const TITLES = { dashboard: "Dashboard", order: "Order", produk: "Master Produk", pelanggan: "Pelanggan", keuangan: "Keuangan", laporan: "Laporan", pengaturan: "Pengaturan" };
function go(v) {
  S.view = v; $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.v === v));
  $("#pageTitle").textContent = TITLES[v]; $("#topActions").innerHTML = ""; $("#view").innerHTML = "";
  guard(VIEWS[v])(); refreshSummary();
}
const emptyBox = (txt) => `<div class="empty">${mascotOn() ? '<img src="/img/herstood-face.jpg" alt=""><br>' : ""}${txt}</div>`;

/* ============ dashboard ============ */
async function vDashboard() {
  const [d, all] = await Promise.all([api("GET", "/api/dashboard"), api("GET", "/api/orders?date=all")]);
  const t = d.today, w = d.week;
  const out = all.filter(o => !o.paid && o.status !== "batal");
  const outSum = out.reduce((a, o) => a + o.total - o.paid_amount, 0);
  const max = Math.max(1, ...w.daily.map(x => x.revenue));
  $("#view").innerHTML = `
  <div class="card hero mascot-wrap"><img src="/img/herstood.jpg" alt=""><div><h2>Halo, ${esc(S.user.name)}! ♡</h2>
    <p>Hari ini ada <b>${t.orders}</b> order dan uang masuk <b>${fmt(t.paid_total)}</b>. ${out.length ? `Masih ada <b>${out.length}</b> tagihan belum lunas (${fmt(outSum)}).` : "Semua tagihan sudah lunas, mantap!"}</p>
    <button class="btn" id="hNew">+ Order Baru</button></div></div>
  <div class="grid cards4">
    <div class="card stat pk"><small>Order hari ini</small><b>${t.orders}</b></div>
    <div class="card stat"><small>Omset hari ini</small><b>${fmt(t.revenue)}</b></div>
    <div class="card stat"><small>Uang diterima (termasuk DP)</small><b style="color:var(--ok)">${fmt(t.paid_total)}</b></div>
    <div class="card stat"><small>DP diterima (belum lunas)</small><b style="color:var(--primary-dark)">${fmt(t.dp_total)}</b></div>
    <div class="card stat"><small>Total sisa tagihan (semua order)</small><b style="color:var(--warn)">${fmt(outSum)}</b></div>
    <div class="card stat"><small>Laba kotor hari ini</small><b>${fmt(t.gross_profit)}</b></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:14px">
    <div class="card"><h2>Omset 7 hari terakhir</h2>${barChart(w.daily, max)}</div>

function barChart(daily, max) {

}
function topTable(rows) {

/* ============ order (kanban) ============ */

let ORDERS = [];
function vOrder() {

    <div class="searchbox">${svg("search")}<input class="input" id="oSearch" placeholder="Cari order atau pelanggan" value="${esc(S.orderFilter.q)}"></div>

    if (sel.value === "pick") { $("#oDatePick").classList.remove("hidden"); $("#oDatePick").value = todayStr(); S.orderFilter.date = todayStr(); }

const loadOrders = guard(async () => {

  ORDERS = await api("GET", "/api/orders?" + p);

});
function timeLabel(s) {
  const d = new Date(s.replace(" ", "T")); const hm = d.toTimeString().slice(0, 5);
  return todayStr(d) === todayStr() ? `Hari ini, ${hm}` : `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}, ${hm}`;
}
function payBadge(o) {
  if (o.paid) return '<span class="badge paid">Sudah Bayar</span>';
  if (o.paid_amount > 0) return `<span class="badge dp" title="DP ${fmt(o.paid_amount)}">DP · sisa ${fmt(o.total - o.paid_amount)}</span>`;
  return '<span class="badge unpaid">Belum Bayar</span>';
}
function renderBoard() {
  const b = $("#board"); if (!b) return;
  b.innerHTML = COLS.map(([k, l, color, pg]) => {
    const list = ORDERS.filter(o => o.status === k);
    return `<div class="col" data-s="${k}"><div class="col-h"><span class="dot" style="background:${color}"></span>${l}<span class="cnt">${list.length}</span></div>
    ${list.map(o => `<div class="ocard" draggable="true" data-id="${o.id}">
      <div class="no">${esc(o.number)}</div>

      <div class="meta">${svg("clock")}<span>${timeLabel(o.created_at)}</span></div>
      <div class="meta">${svg("bag")}<span>${esc(o.preview || "")}</span></div>
      ${(o.countries || []).length ? `<div class="cbs">${o.countries.map(cBadge).join("")}</div>` : ""}
      <div class="price">${fmt(o.total)}</div>
      <div class="foot"><span class="meta" style="margin:0">${o.item_count} item</span>${payBadge(o)}</div>
      <div class="foot"><span class="meta" style="margin:0">${esc(o.type)}</span>${k !== "selesai" ? `<button class="adv" data-adv="${o.id}">Lanjut ▸</button>` : ""}</div>
      <div class="prog"><i style="width:${pg}%;background:${color}"></i></div></div>`).join("") || `<p class="muted" style="text-align:center;font-size:12px">Kosong ✿</p>`}
    </div>`;
  }).join("");
  $$(".ocard", b).forEach(c => {
    c.onclick = e => { if (e.target.closest("[data-adv]")) return; openInvoice(+c.dataset.id); };
    c.ondragstart = e => { e.dataTransfer.setData("text/plain", c.dataset.id); };
  });
  $$("[data-adv]", b).forEach(btn => btn.onclick = guard(async () => {
    const o = ORDERS.find(x => x.id === +btn.dataset.adv); const i = COLS.findIndex(c => c[0] === o.status);
    await api("PUT", "/api/orders/" + o.id, { status: COLS[i + 1][0] }); await loadOrders(); refreshSummary();
  }));
  $$(".col", b).forEach(col => {

    col.ondragleave = () => col.classList.remove("over");

      e.preventDefault(); col.classList.remove("over");

      if (o && o.status !== col.dataset.s) { await api("PUT", "/api/orders/" + id, { status: col.dataset.s }); await loadOrders(); }
    });
  });
}

      <div class="field" style="margin:0"><label>Jenis</label><select class="input" id="pType"><option>Pre-Order</option><option>Ready Stock</option><option>Titip Beli</option></select></div></div>

      <div class="two"><div class="field" style="margin:0"><label>Diskon (${esc(S.settings.currency)})</label><input class="input" type="number" min="0" id="pDisc" placeholder="0"></div>

  $("#pClose", m).onclick = closeModal;
  
  /* produk master */
  function renderMaster() {

      : emptyBox("Keranjang masih kosong");
    $$("[data-rm]", m).forEach(b => b.onclick = () => { cart.splice(+b.dataset.rm, 1); renderLines(); renderTotals(); });
    $$(".cline", m).forEach(row => {
      const l = cart[+row.dataset.i];
      $$("input", row).forEach(inp => inp.oninput = () => {

  function renderTotals() {

    const md = curMode(t), amt = curAmount(t);

      <div class="two"><div class="field" style="margin:0"><label>Nominal dibayar sekarang</label><input class="input" type="number" min="0" id="pAmt" value="${amt || ""}" ${md === "lunas" ? "readonly" : ""}></div>

    $$("[data-pm]", m).forEach(c => c.onclick = () => { pay.method = c.dataset.pm; renderPay(); });
    const upd = () => {

    $("#pCash", m)?.addEventListener("input", e => { pay.cash = e.target.value; upd(); });
    upd();

  $("#pSave", m).onclick = guard(async () => {

function invBarcode(str) {
  let x = 0, bars = "";
  [...String(str)].flatMap(c => { const n = c.charCodeAt(0); return [1 + n % 3, 1 + (n >> 2) % 2, 1 + (n >> 1) % 3]; }).forEach((w, i) => { if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="28"/>`; x += w; });
  return `<svg class="ibar" viewBox="0 0 ${x} 28" preserveAspectRatio="none" fill="#231f1e" aria-hidden="true">${bars}</svg>`;
}

function waText(o) {
  const st = S.settings, f = n => `${st.currency || "Rp"} ${Math.round(n).toLocaleString("id-ID")}`;
  const dpAmt = Math.min(o.dp_target || 0, o.total), hasDp = dpAmt > 0 && dpAmt < o.total;
  let t = `*INVOICE ${o.number}* - ${st.store_name}\nHalo kak ${o.customer_name}!\n\n`;
  o.items.forEach((i, n) => { t += `${n + 1}. ${i.country ? cCode(i.country) + " " : ""}${i.code ? i.code + " " : ""}${i.name} x${i.qty} = ${f(i.price * i.qty)}\n`; });
  if (o.discount) t += `\nDiskon: -${f(o.discount)}`; if (o.tax) t += `\nPajak: ${f(o.tax)}`;

}

function customerForm(c = {}) {
  const m = openModal(`<h3>${c.id ? "Edit" : "Tambah"} Pelanggan ♡</h3>
    <div class="field"><label>Nama</label><input class="input" id="cName" value="${esc(c.name)}"></div>
    <div class="field"><label>Telepon / WA</label><input class="input" id="cPhone" value="${esc(c.phone)}"></div>
    <div class="field"><label>Alamat</label><input class="input" id="cAddr" value="${esc(c.address)}"></div>
    <div class="field"><label>Catatan</label><input class="input" id="cNote" value="${esc(c.note)}"></div>
    <div class="row"><button class="btn" id="cSave">Simpan</button><button class="btn sec" id="cCancel">Batal</button></div>`);
  $("#cCancel", m).onclick = closeModal;
  $("#cSave", m).onclick = guard(async () => {
    const b = { name: $("#cName", m).value, phone: $("#cPhone", m).value, address: $("#cAddr", m).value, note: $("#cNote", m).value };
    if (c.id) await api("PUT", "/api/customers/" + c.id, b); else await api("POST", "/api/customers", b);
    closeModal(); await refreshProducts(); vCustomers(); toast("Pelanggan disimpan");
  });
}

/* ============ keuangan ============ */
let finMonth = todayStr().slice(0, 7);
async function vFinance() {
  const [y, mo] = finMonth.split("-").map(Number); const from = `${finMonth}-01`; const to = todayStr(new Date(y, mo, 0));
  const [r, ex] = await Promise.all([api("GET", `/api/report?from=${from}&to=${to}`), api("GET", `/api/expenses?from=${from}&to=${to}`)]);
  $("#topActions").innerHTML = `<input type="month" class="input" id="fMonth" value="${finMonth}" style="width:auto"><button class="btn" id="fNew">+ Catat Pengeluaran</button>`;
  $("#fMonth").onchange = e => { finMonth = e.target.value || finMonth; vFinance(); };
  $("#fNew").onclick = () => expenseForm();
  $("#view").innerHTML = `<div class="grid cards4">
    <div class="card stat"><small>Pemasukan (uang diterima, termasuk DP)</small><b style="color:var(--ok)">${fmt(r.paid_total)}</b></div>
    <div class="card stat"><small>Sisa tagihan (piutang)</small><b style="color:var(--warn)">${fmt(r.unpaid_total)}</b></div>
    <div class="card stat"><small>Modal barang terjual</small><b>${fmt(r.cogs)}</b></div>
    <div class="card stat"><small>Pengeluaran</small><b style="color:var(--danger)">${fmt(r.expenses)}</b></div>
    <div class="card stat pk"><small>Laba bersih (kas)</small><b>${fmt(r.net_profit)}</b></div></div>
    <h2 style="margin-top:18px">Daftar pengeluaran</h2>
    <div class="table-wrap"><table><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th class="num">Nominal</th><th>Dicatat</th><th></th></tr>
    ${ex.map(e => `<tr><td>${e.date}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td class="num">${fmt(e.amount)}</td><td>${esc(e.cashier)}</td><td class="num">${isAdmin() ? `<button class="btn danger sm" data-d="${e.id}">Hapus</button>` : ""}</td></tr>`).join("") || '<tr><td colspan="6" class="muted">Belum ada pengeluaran bulan ini.</td></tr>'}</table></div>`;
  $$("[data-d]").forEach(b => b.onclick = guard(async () => { if (confirm("Hapus pengeluaran ini?")) { await api("DELETE", "/api/expenses/" + b.dataset.d); vFinance(); } }));
}
function expenseForm() {
  const m = openModal(`<h3>Catat Pengeluaran ♡</h3>
    <div class="two"><div class="field"><label>Tanggal</label><input type="date" class="input" id="eDate" value="${todayStr()}"></div>
    <div class="field"><label>Kategori</label><input class="input" id="eCat" list="ecats" value="Beli barang jastip"><datalist id="ecats"><option>Beli barang jastip</option><option>Ongkir / kargo</option><option>Packing</option><option>Operasional</option><option>Pengembalian DP</option><option>Lain-lain</option></datalist></div></div>
    <div class="field"><label>Keterangan</label><input class="input" id="eDesc"></div>
    <div class="field"><label>Nominal</label><input class="input" type="number" id="eAmt"></div>
    <div class="row"><button class="btn" id="eSave">Simpan</button><button class="btn sec" id="eCancel">Batal</button></div>`);
  $("#eCancel", m).onclick = closeModal;
  $("#eSave", m).onclick = guard(async () => {
    await api("POST", "/api/expenses", { date: $("#eDate", m).value, category: $("#eCat", m).value, description: $("#eDesc", m).value, amount: $("#eAmt", m).value });
    closeModal(); vFinance(); toast("Pengeluaran dicatat");
  });
}

/* ============ laporan ============ */
let rep = { from: todayStr(new Date(Date.now() - 6 * 864e5)), to: todayStr() };
async function vReport() {
  $("#topActions").innerHTML = `<select class="input" id="rPre" style="width:auto"><option value="">Rentang…</option><option value="0">Hari ini</option><option value="6">7 hari</option><option value="29">30 hari</option><option value="m">Bulan ini</option></select>
    <input type="date" class="input" id="rFrom" value="${rep.from}" style="width:auto"><input type="date" class="input" id="rTo" value="${rep.to}" style="width:auto">
    ${isAdmin() ? `<button class="btn sec" id="rCsv">Unduh CSV</button>` : ""}`;
  $("#rPre").onchange = e => { const v = e.target.value; if (v === "") return; rep.to = todayStr(); rep.from = v === "m" ? todayStr().slice(0, 8) + "01" : todayStr(new Date(Date.now() - (+v) * 864e5)); vReport(); };
  $("#rFrom").onchange = e => { rep.from = e.target.value; vReport(); }; $("#rTo").onchange = e => { rep.to = e.target.value; vReport(); };
  $("#rCsv")?.addEventListener("click", guard(async () => {
    const r = await api("GET", `/api/export.csv?from=${rep.from}&to=${rep.to}`, null, true); const blob = await r.blob();
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `laporan-${rep.from}-sd-${rep.to}.csv`; a.click();
  }));
  const r = await api("GET", `/api/report?from=${rep.from}&to=${rep.to}`);
  $("#view").innerHTML = `<div class="grid cards4">
    <div class="card stat pk"><small>Jumlah order</small><b>${r.orders}</b></div><div class="card stat"><small>Omset</small><b>${fmt(r.revenue)}</b></div>
    <div class="card stat"><small>Laba kotor</small><b>${fmt(r.gross_profit)}</b></div><div class="card stat"><small>DP diterima (belum lunas)</small><b>${fmt(r.dp_total)}</b></div>
    <div class="card stat"><small>Sisa tagihan</small><b style="color:var(--warn)">${fmt(r.unpaid_total)}</b></div></div>
    <div class="card" style="margin-top:14px"><h2>Omset per hari</h2>${barChart(r.daily)}</div>
    <div class="card" style="margin-top:14px"><h2>Per negara asal</h2>${countryTable(r.by_country)}</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:14px">
      <div class="card"><h2>Produk terlaris</h2>${topTable(r.top_products)}</div>
      <div class="card"><h2>Metode pembayaran</h2>${r.methods.length ? `<table><tr><th>Metode</th><th class="num">Transaksi</th><th class="num">Total</th></tr>${r.methods.map(x => `<tr><td>${esc(x.method || "-")}</td><td class="num">${x.orders}</td><td class="num">${fmt(x.total)}</td></tr>`).join("")}</table>` : '<p class="muted">Belum ada.</p>'}
      <h2 style="margin-top:16px">Per kasir</h2>${r.cashiers.length ? `<table><tr><th>Kasir</th><th class="num">Order</th><th class="num">Total</th></tr>${r.cashiers.map(x => `<tr><td>${esc(x.cashier)}</td><td class="num">${x.orders}</td><td class="num">${fmt(x.total)}</td></tr>`).join("")}</table>` : '<p class="muted">Belum ada.</p>'}</div></div>`;
}

/* ============ pengaturan ============ */
async function vSettings() {
  const s = { ...S.settings };
  const users = isAdmin() ? await api("GET", "/api/users") : [];
  const colorField = (k, l) => `<div class="field"><label>${l}</label><input type="color" data-k="${k}" value="${s[k]}"></div>`;
  $("#view").innerHTML = `
  ${isAdmin() ? `
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">
    <div class="card"><h2>Toko & Invoice</h2>
      <div class="two"><div class="field"><label>Nama toko</label><input class="input" data-k="store_name" value="${esc(s.store_name)}"></div>
      <div class="field"><label>Tagline</label><input class="input" data-k="tagline" value="${esc(s.tagline || "")}"></div></div>
      <div class="field"><label>Alamat / Instagram</label><input class="input" data-k="store_address" value="${esc(s.store_address)}"></div>
      <div class="field"><label>Telepon / WA</label><input class="input" data-k="store_phone" value="${esc(s.store_phone)}"></div>
      <div class="three"><div class="field"><label>Awalan invoice</label><input class="input" data-k="invoice_prefix" value="${esc(s.invoice_prefix)}"></div>
      <div class="field"><label>Pajak (%)</label><input class="input" type="number" step="0.1" data-k="tax_percent" value="${s.tax_percent}"></div>
      <div class="field"><label>Mata uang</label><input class="input" data-k="currency" value="${esc(s.currency)}"></div></div>
      <div class="field"><label>Pesan di bawah invoice</label><input class="input" data-k="invoice_footer" value="${esc(s.invoice_footer)}"></div>
      <div class="field"><label>Negara asal barang (pisahkan koma)</label><input class="input" id="sCountries" value="${esc((s.countries || COUNTRY_DEFAULT).join(", "))}"></div>
      <div class="field"><label>Metode pembayaran (pisahkan koma)</label><input class="input" id="sMethods" value="${esc((s.payment_methods || []).join(", "))}"></div></div>
    <div class="card"><h2>Tema & Warna</h2>
      <div class="field"><label>Preset cepat</label><div class="swatch">${Object.entries(PRESETS).map(([n, p]) => `<button data-preset="${n}"><i style="background:linear-gradient(135deg,${p.color_sidebar} 50%,${p.color_primary} 50%)"></i>${n}</button>`).join("")}</div></div>
      <div class="three">${colorField("color_primary", "Warna utama")}${colorField("color_accent", "Warna aksen")}${colorField("color_sidebar", "Sidebar")}</div>
      <div class="three">${colorField("color_bg", "Latar halaman")}${colorField("color_card", "Latar kartu")}${colorField("color_text", "Warna teks & garis")}</div>
      <div class="three"><div class="field"><label>Sudut (px)</label><input class="input" type="number" min="0" max="28" data-k="radius" value="${s.radius}"></div>
      <div class="field"><label>Font</label><select class="input" data-k="font">${Object.keys(FONTS).map(f => `<option ${s.font === f ? "selected" : ""} value="${f}">${FONT_LABEL[f]}</option>`).join("")}</select></div>
      <div class="field"><label>Mode gelap</label><select class="input" data-k="dark_mode"><option value="0" ${+s.dark_mode ? "" : "selected"}>Mati</option><option value="1" ${+s.dark_mode ? "selected" : ""}>Hidup</option></select></div></div>
      <div class="field"><label>Karakter Herstood (sidebar, dashboard, invoice)</label><select class="input" data-k="mascot_on"><option value="1" ${+s.mascot_on !== 0 ? "selected" : ""}>Tampil</option><option value="0" ${+s.mascot_on === 0 ? "selected" : ""}>Sembunyikan</option></select></div>
      <p class="muted sm" style="margin:0">Perubahan langsung terlihat. Klik Simpan agar berlaku untuk semua kasir.</p></div>
  </div>
  <div class="row" style="margin:14px 0"><button class="btn" id="sSave">Simpan Pengaturan</button><button class="btn sec" id="sBackup">Unduh Backup Database</button></div>
  <div class="card"><div class="row"><h2 style="margin:0">Akun Kasir</h2><span class="spacer"></span><button class="btn sm" id="uNew">+ Tambah akun</button></div>
    <table style="margin-top:10px"><tr><th>Username</th><th>Nama</th><th>Peran</th><th>Status</th><th></th></tr>
    ${users.map(u => `<tr><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${u.role}</td><td><span class="badge ${u.active ? "paid" : "off"}">${u.active ? "Aktif" : "Nonaktif"}</span></td>
    <td class="num"><button class="btn sec sm" data-pw="${u.id}">Reset password</button> ${u.id !== S.user.id ? `<button class="btn sec sm" data-tg="${u.id}">${u.active ? "Nonaktifkan" : "Aktifkan"}</button>` : ""}</td></tr>`).join("")}</table></div>` : ""}
  <div class="card" style="margin-top:14px;max-width:420px"><h2>Ganti Password Saya</h2>
    <div class="field"><input class="input" type="password" id="pOld" placeholder="Password lama"></div>
    <div class="field"><input class="input" type="password" id="pNew" placeholder="Password baru (min. 6 karakter)"></div>
    <button class="btn" id="pSave">Ganti Password</button></div>`;
  if (isAdmin()) {
    $$("[data-k]").forEach(el => el.oninput = el.onchange = () => { s[el.dataset.k] = (el.type === "number" || ["dark_mode", "mascot_on"].includes(el.dataset.k)) ? +el.value : el.value; applyTheme(s); });
    $$("[data-preset]").forEach(b => b.onclick = () => { Object.assign(s, PRESETS[b.dataset.preset]); applyTheme(s); $$("[type=color]").forEach(c => c.value = s[c.dataset.k]); });
    $("#sSave").onclick = guard(async () => {
      s.payment_methods = $("#sMethods").value.split(",").map(x => x.trim()).filter(Boolean);
      s.countries = $("#sCountries").value.split(",").map(x => x.trim()).filter(Boolean);
      S.settings = await api("PUT", "/api/settings", s); applyTheme(); toast("Pengaturan disimpan");
    });
    $("#sBackup").onclick = guard(async () => {
      const r = await api("GET", "/api/backup", null, true); const blob = await r.blob();
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `backup-kasir-${todayStr()}.json`; a.click();
    });
    $("#uNew").onclick = () => {
      const m = openModal(`<h3>Tambah Akun</h3><div class="field"><label>Username</label><input class="input" id="uU"></div><div class="field"><label>Nama</label><input class="input" id="uN"></div>
        <div class="two"><div class="field"><label>Password</label><input class="input" type="password" id="uP"></div><div class="field"><label>Peran</label><select class="input" id="uR"><option value="kasir">Kasir</option><option value="admin">Admin</option></select></div></div>
        <div class="row"><button class="btn" id="uS">Simpan</button><button class="btn sec" id="uC">Batal</button></div>`);
      $("#uC", m).onclick = closeModal;
      $("#uS", m).onclick = guard(async () => { await api("POST", "/api/users", { username: $("#uU", m).value, name: $("#uN", m).value, password: $("#uP", m).value, role: $("#uR", m).value }); closeModal(); vSettings(); });
    };
    $$("[data-pw]").forEach(b => b.onclick = guard(async () => { const p = prompt("Password baru (min. 6 karakter):"); if (p) { await api("PUT", "/api/users/" + b.dataset.pw, { password: p }); toast("Password diganti"); } }));
    $$("[data-tg]").forEach(b => b.onclick = guard(async () => { const u = users.find(x => x.id === +b.dataset.tg); await api("PUT", "/api/users/" + u.id, { active: u.active ? 0 : 1 }); vSettings(); }));
  }
  $("#pSave").onclick = guard(async () => { await api("POST", "/api/change-password", { old: $("#pOld").value, new: $("#pNew").value }); $("#pOld").value = $("#pNew").value = ""; toast("Password diganti"); });
}

/* ============ boot ============ */
(async () => { if (S.token) await start(); else showLogin(); })();
</script>
</body>
</html>
